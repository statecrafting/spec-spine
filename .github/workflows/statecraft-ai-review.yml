        value: ${{ jobs.review.outputs.result }}
      release_candidate:
        description: whether the head ref matches the release branch pattern
        value: ${{ jobs.review.outputs.release_candidate }}
      answered:
        description: true when every finding is low and other and answered by a review note for this head (spec 068)
        value: ${{ jobs.review.outputs.answered }}

permissions:
  contents: read

