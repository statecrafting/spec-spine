name: release

# Tag-gated prebuilt-binary release. Pushing a `v*` tag builds a per-triple
# archive (with a .sha256 sidecar) for each of the five supported targets,
# attaches them to the GitHub Release, and publishes the crates to crates.io.
# install.sh (curl | sh) consumes the archives.
#
# Four triples build natively on a matching-arch GitHub runner; x86_64-apple-darwin
# cross-compiles on the Apple Silicon runner, because the Intel macos-13 runner is
# deprecated and queues badly. The crate source is identical, so the binary matches
# what the determinism workflow proves byte-identical.
#
# publish-crates, publish-npm, and publish-pypi are idempotent: each skips any
# version already live (crates.io / npm / PyPI), so re-running a tag is safe.
# publish-npm and publish-pypi assemble their packages/wheels from the SAME build
# archives (no second Rust build); publish-npm is gated on NPM_TOKEN and
# publish-pypi on vars.PYPI_TRUSTED_PUBLISHING: absent the one-time setup each
# is a clean no-op. Each archive ships a per-target CycloneDX SBOM and a SLSA
# build-provenance attestation (spec 019), whose Sigstore bundle is attached as
# `<archive>.intoto.jsonl`; a build that cannot sign fails before any publish,
# and verify-release re-checks the published release after publish (spec 201).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build · ${{ matrix.triple }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    triple: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, triple: aarch64-unknown-linux-gnu }
          # x86_64-apple-darwin cross-compiles on the Apple Silicon runner (Xcode
          # ships the x86_64 SDK); avoids the deprecated, slow-to-queue macos-13.
          - { os: macos-latest,     triple: x86_64-apple-darwin }
          - { os: macos-latest,     triple: aarch64-apple-darwin }
          - { os: windows-latest,   triple: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    # Spec 019: id-token + attestations are for the build-provenance attestation
    # over each archive; nothing in this job writes repo contents.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add target (no-op if native)
        run: rustup target add ${{ matrix.triple }}
      - name: Build release binary
        run: cargo build --release --locked --bin spec-spine --target ${{ matrix.triple }}

      - name: Stage archive contents
        shell: bash
        run: |
          set -euo pipefail
          EXT=""; [ "${{ runner.os }}" = "Windows" ] && EXT=".exe"
          mkdir -p staging
          cp "target/${{ matrix.triple }}/release/spec-spine${EXT}" staging/
          cp LICENSE README.md staging/
          echo "ARCHIVE_BASE=spec-spine-${GITHUB_REF_NAME}-${{ matrix.triple }}" >> "$GITHUB_ENV"

      - name: Package (tar.gz + sha256) for Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tar -C staging -czf "${ARCHIVE_BASE}.tar.gz" .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_BASE}.tar.gz" > "${ARCHIVE_BASE}.tar.gz.sha256"
          else
            shasum -a 256 "${ARCHIVE_BASE}.tar.gz" > "${ARCHIVE_BASE}.tar.gz.sha256"
          fi
          cat "${ARCHIVE_BASE}.tar.gz.sha256"
          echo "ARCHIVE_FILE=${ARCHIVE_BASE}.tar.gz" >> "$GITHUB_ENV"   # the attestation subject (spec 019)

      - name: Package (zip + sha256) for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $base = $env:ARCHIVE_BASE
          Compress-Archive -Path staging/* -DestinationPath "$base.zip" -Force
          $hash = (Get-FileHash "$base.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $base.zip" | Out-File -Encoding ascii -NoNewline "$base.zip.sha256"
          Get-Content "$base.zip.sha256"
          Add-Content -Path $env:GITHUB_ENV -Value "ARCHIVE_FILE=$base.zip"   # the attestation subject (spec 019)

      # --- Supply-chain artifacts (spec 019): per-target CycloneDX SBOM + provenance ---
      # NOTE: these steps run only on a `v*` tag (this workflow is tag-gated), so
      # they are not exercised by PR CI. Third-party actions are pinned to a full
      # commit SHA (the `# vX.Y.Z` comment is the human-readable version) so a tag
      # or branch rewrite upstream cannot alter a release build; Dependabot
      # (.github/dependabot.yml) proposes SHA bumps for review.
      - name: Generate per-target CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .                                    # syft's cargo cataloger reads the committed Cargo.lock
          format: cyclonedx-json
          output-file: ${{ env.ARCHIVE_BASE }}.cdx.json
          upload-artifact: false                     # attached via the archive artifact below, not separately
      - name: Fail closed if the SBOM has no components
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const n=(d.components||[]).length;console.log('SBOM components:',n);if(n===0){console.error('refusing to ship an SBOM with zero components (syft cataloger regression?)');process.exit(1);}" "${ARCHIVE_BASE}.cdx.json"
      # Spec 201 §3.2: every `v*` tag is a signed release, with no opt-out. A
      # build that cannot request the OIDC token cannot sign, so it fails here,
      # before the attestation, and every publish job (`needs: build`) skips.
      - name: Require signing (OIDC token available)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error title=signing unavailable::no OIDC token (ACTIONS_ID_TOKEN_REQUEST_URL / ACTIONS_ID_TOKEN_REQUEST_TOKEN absent); refusing to publish an unsigned release"
            exit 1
          fi
          echo "OIDC token request available; the archive will be signed"
      - name: Attest build provenance for the archive
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE_FILE }}
      # Spec 201 §3.1/§3.2: the Sigstore bundle travels with the archive as
      # `<archive>.intoto.jsonl`, so an archive verifies offline; an absent or
      # empty bundle fails the build before anything publishes.
      - name: Stage the attestation bundle next to its archive
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          src="${BUNDLE_PATH:-}"
          # Windows runners hand back a native path; Git Bash reads it via cygpath.
          if [ -n "$src" ] && command -v cygpath >/dev/null 2>&1; then src="$(cygpath -u "$src")"; fi
          if [ -z "$src" ] || [ ! -s "$src" ]; then
            echo "::error title=no attestation bundle::attestation produced no bundle for ${ARCHIVE_FILE}; refusing to publish an unsigned release"
            exit 1
          fi
          cp "$src" "${ARCHIVE_FILE}.intoto.jsonl"
          ls -la "${ARCHIVE_FILE}.intoto.jsonl"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.triple }}
          path: |
            spec-spine-*.tar.gz
            spec-spine-*.tar.gz.sha256
            spec-spine-*.zip
            spec-spine-*.zip.sha256
            spec-spine-*.cdx.json
            spec-spine-*.intoto.jsonl
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: archive-*
          merge-multiple: true
      - name: List release assets
        run: ls -la dist
      - name: Create / update the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  # Spec 201 §3.3: the release proves what it published. This job reads the
  # GitHub Release for the tag (the assets a consumer downloads, not the build
  # artifacts) and fails the run unless every triple's archive, .sha256, SBOM
  # and attestation bundle are present, the checksum matches, and the
  # attestation verifies both against the attached bundle and against the
  # attestation store. It unpublishes nothing: a red run is the signal, and the
  # remedy is the maintainer's (docs/releasing.md).
  verify-release:
    name: verify the published release
    needs: publish
    runs-on: ubuntu-latest
    # attestations: read because `gh attestation verify` without --bundle reads
    # the attestation store through the API.
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download the published release assets
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "$TAG" --repo "$REPO" --dir published
          ls -la published
      - name: Verify every archive's checksum, SBOM and attestation (bundle and store)
        working-directory: published
        run: |
          set -uo pipefail
          failures=0
          fail() { echo "::error title=verify-release::$1"; failures=$((failures + 1)); }
          for triple in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                        x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
            ext=tar.gz; [ "$triple" = x86_64-pc-windows-msvc ] && ext=zip
            archive="spec-spine-${TAG}-${triple}.${ext}"
            echo "::group::${archive}"
            # 1. the archive, its .sha256, its SBOM and its bundle are all present.
            missing=0
            for f in "$archive" "${archive}.sha256" "spec-spine-${TAG}-${triple}.cdx.json" "${archive}.intoto.jsonl"; do
              if [ ! -s "$f" ]; then fail "missing or empty release asset: $f"; missing=1; fi
            done
            if [ "$missing" -eq 0 ]; then
              # 2. the archive's SHA-256 equals its .sha256 sidecar.
              expected="$(awk 'NR == 1 { print tolower($1) }' "${archive}.sha256")"
              actual="$(sha256sum "$archive" | awk '{ print $1 }')"
              if [ "$expected" = "$actual" ]; then
                echo "sha256 ok: $actual"
              else
                fail "sha256 mismatch for $archive: sidecar $expected, asset $actual"
              fi
              # 3. the attestation verifies against the attached bundle.
              gh attestation verify "$archive" --bundle "${archive}.intoto.jsonl" --repo "$REPO" \
                || fail "attestation does not verify against the attached bundle: $archive"
              # 4. the attestation verifies against the attestation store.
              gh attestation verify "$archive" --repo "$REPO" \
                || fail "attestation does not verify against the attestation store: $archive"
            fi
            echo "::endgroup::"
          done
          if [ "$failures" -ne 0 ]; then
            echo "verify-release: $failures check(s) failed for $TAG; the release is published but does not verify (docs/releasing.md)" >&2
            exit 1
          fi
          echo "verify-release: every published asset for $TAG verifies"

  publish-crates:
    name: publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish types, core, cli (tolerate versions already on crates.io)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # No -e: we inspect cargo's exit so an already-published version is a
          # skip, not a failure (re-running a tag is then idempotent). cargo
          # publish waits for the new version to be queryable before returning,
          # so the next dependent crate's verify build finds it. No crates.io API
          # call here: that endpoint needs a User-Agent and is easy to get wrong.
          set -uo pipefail
          for crate in spec-spine-types spec-spine-core spec-spine-cli; do
            echo "::group::publish $crate"
            if out="$(cargo publish -p "$crate" --locked 2>&1)"; then
              echo "$out"; echo ">> published $crate"
            else
              echo "$out"
              if echo "$out" | grep -qiE "already (uploaded|exists)"; then
                echo ">> $crate version already on crates.io, skipping"
              else
                echo ">> publish failed for $crate"; exit 1
              fi
            fi
            echo "::endgroup::"
          done

  publish-npm:
    name: publish to npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Gate on NPM_TOKEN: absent the secret, the whole job is a clean no-op (a
      # skip, never a red X), the same posture as the crates.io token. The first
      # publish, the NPM_TOKEN, and the one-time `@spec-spine` org creation are a
      # human's job (see docs/releasing.md).
      - name: Check for NPM_TOKEN
        id: gate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=npm publish skipped::NPM_TOKEN secret not set; skipping npm publish"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.present == 'true'
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # The npm platform packages bundle the prebuilt binaries directly, so they
      # are assembled from the build job's archives (no second Rust build).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.gate.outputs.present == 'true'
        with:
          path: dist/archives
          pattern: archive-*
          merge-multiple: true

      - name: Assemble platform packages from the release archives
        if: steps.gate.outputs.present == 'true'
        working-directory: npm
        run: |
          set -euo pipefail
          cp ../LICENSE LICENSE                         # ship the license in the main tarball
          VERSION="${GITHUB_REF_NAME#v}"                # tag v0.1.0 -> 0.1.0
          # --write-main locks the main package version + optionalDependencies to
          # the tag; the generator fails loudly if the tag and committed version
          # disagree on a non-write run, so the lock can never drift silently.
          node scripts/generate-platform-packages.js \
            --version "$VERSION" --archives ../dist/archives --out dist/packages --write-main
          ls -la dist/packages/@spec-spine

      - name: Publish (idempotent; skip versions already on npm)
        if: steps.gate.outputs.present == 'true'
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # No -e: we inspect each publish so an already-published version is a
          # skip, not a failure (re-running a tag is then idempotent). `npm view`
          # is the precheck: it 404s (non-zero) for an unpublished version.
          set -uo pipefail
          publish_if_absent() {
            local dir="$1" name version
            name="$(node -p "require('./${dir}/package.json').name")"
            version="$(node -p "require('./${dir}/package.json').version")"
            echo "::group::publish ${name}@${version}"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo ">> ${name}@${version} already on npm, skipping"
            else
              # --access public: scoped packages default to restricted.
              npm publish "${dir}" --access public
              echo ">> published ${name}@${version}"
            fi
            echo "::endgroup::"
          }
          # Platform packages first, then the main package, so there is never a
          # window where `spec-spine` is live without its binaries.
          for d in dist/packages/@spec-spine/*; do
            publish_if_absent "$d"
          done
          publish_if_absent "."

  publish-pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # OIDC Trusted Publishing needs an id-token; nothing here writes repo contents.
    permissions:
      id-token: write
    # A dedicated environment is the recommended scope for the Trusted Publisher
    # (configure the same name on PyPI). Harmless if the environment is absent.
    environment:
      name: pypi
      url: https://pypi.org/p/spec-spine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Gate on a repository variable, not a secret: Trusted Publishing has no
      # token to detect. Absent/false => clean skip (a notice, never a red X),
      # the same posture as publish-npm's NPM_TOKEN gate. A human flips this on
      # after the one-time PyPI project + Trusted Publisher setup (docs/releasing.md).
      - name: Check Trusted Publishing is enabled
        id: gate
        env:
          ENABLED: ${{ vars.PYPI_TRUSTED_PUBLISHING }}
        run: |
          if [ "${ENABLED:-false}" = "true" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=PyPI publish skipped::vars.PYPI_TRUSTED_PUBLISHING is not 'true'; skipping PyPI publish"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.gate.outputs.present == 'true'
        with:
          python-version: "3.12"

      - name: Install the build frontend
        if: steps.gate.outputs.present == 'true'
        run: python -m pip install --upgrade build

      # The wheels bundle the prebuilt binaries directly, so they are assembled
      # from the build job's archives (no second Rust build) -- exactly the
      # publish-npm pattern.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.gate.outputs.present == 'true'
        with:
          path: dist/archives
          pattern: archive-*
          merge-multiple: true

      - name: Assemble wheels + sdist from the release archives
        if: steps.gate.outputs.present == 'true'
        working-directory: py
        run: |
          set -euo pipefail
          cp ../LICENSE LICENSE                         # ship the license in the sdist + wheels
          VERSION="${GITHUB_REF_NAME#v}"                # tag v0.1.0 -> 0.1.0
          # generate_wheels.py verifies the tag matches the committed project
          # version and fails loudly on a mismatch, so the lock cannot drift
          # silently (parity with the npm generator's --write-main check).
          python scripts/generate_wheels.py \
            --version "$VERSION" --archives ../dist/archives --out dist/pypi --build-sdist
          ls -la dist/pypi

      # Trusted Publishing + PEP 740 attestations. `skip-existing: true` makes a
      # re-run of the same tag idempotent (already-uploaded artifacts are a skip,
      # not a failure) -- the property publish-npm gets from its `npm view`
      # precheck. The action mints the OIDC token and signs each artifact; no
      # token is stored in the repo.
      - name: Publish to PyPI (idempotent; signed)
        if: steps.gate.outputs.present == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: py/dist/pypi
          skip-existing: true
          attestations: true

# -----------------------------------------------------------------------------
# publish-pypi token fallback (only if OIDC Trusted Publishing is not available)
#
# Replace the job's `permissions`/`environment` blocks and the gate + publish
# steps with a PYPI_API_TOKEN secret gate that mirrors publish-npm's NPM_TOKEN
# gate one-for-one (absent secret => clean no-op), and publish with twine:
#
#   permissions:
#     contents: read
#   ...
#   - name: Check for PYPI_API_TOKEN
#     id: gate
#     env:
#       PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
#     run: |
#       if [ -n "${PYPI_API_TOKEN:-}" ]; then
#         echo "present=true" >> "$GITHUB_OUTPUT"
#       else
#         echo "present=false" >> "$GITHUB_OUTPUT"
#         echo "::notice title=PyPI publish skipped::PYPI_API_TOKEN secret not set; skipping PyPI publish"
#       fi
#   ...
#   - name: Publish (idempotent)
#     if: steps.gate.outputs.present == 'true'
#     working-directory: py
#     env:
#       TWINE_USERNAME: __token__
#       TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
#     run: |
#       python -m pip install --upgrade twine
#       # --skip-existing: re-running a tag is idempotent.
#       twine upload --skip-existing dist/pypi/*
#
# The OIDC path is preferred: no long-lived token in the repo and PEP 740
# attestations come for free.
# -----------------------------------------------------------------------------
