          fetch cargo-vet.tar.xz https://github.com/mozilla/cargo-vet/releases/download/v0.10.3/cargo-vet-x86_64-unknown-linux-gnu.tar.xz e83878b80913fbe43629c28768e14ab51f4e86a4ba8f9dd08cc25b8dbc503c19
          tar -xzf "$dir/cargo-deny.tar.gz" -C "$dir" --strip-components=1 cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
          tar -xzf "$dir/cargo-audit.tgz" -C "$dir" --strip-components=1 cargo-audit-x86_64-unknown-linux-musl-v0.22.2/cargo-audit
          tar -xJf "$dir/cargo-vet.tar.xz" -C "$dir" --strip-components=1 cargo-vet-x86_64-unknown-linux-gnu/cargo-vet
