    name: workflow-lint
    if: github.event_name != 'push'
    concurrency:
      group: statecraft-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}-workflow-lint
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install zizmor 1.31.1
        run: |
          dir="${RUNNER_TEMP}/statecraft-tools"
          mkdir -p "$dir"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$dir/zizmor.tar.gz" https://github.com/zizmorcore/zizmor/releases/download/v1.31.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99  $dir/zizmor.tar.gz" | sha256sum -c -
          tar -xzf "$dir/zizmor.tar.gz" -C "$dir" zizmor
          echo "$dir" >> "$GITHUB_PATH"
      - name: zizmor
        run: zizmor --offline --format plain .github/workflows
      - name: Every action pinned by digest
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          script="${RUNNER_TEMP}/statecraft-verify-action-pins.sh"
          case "$BASE_SHA" in 0000000000000000000000000000000000000000) BASE_SHA="" ;; esac
          if [ -n "$BASE_SHA" ] && ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "cannot read the base commit ${BASE_SHA}; the pin check is never taken from the candidate in its place" >&2
            exit 2
          fi
          if [ -n "$BASE_SHA" ] && git show "${BASE_SHA}:scripts/statecraft/verify-action-pins.sh" > "$script" 2>/dev/null; then
            echo "verify-action-pins.sh: read at the base ${BASE_SHA}"
          else
            cp scripts/statecraft/verify-action-pins.sh "$script"
            echo "verify-action-pins.sh: the base carries none; the candidate's copy runs (adoption)"
          fi
          sh "$script" .github/workflows

  # Revision 22 (spec 044 section 3.5): the project's own structural rules,
  # when it commits an sgconfig.yml; the profile ships none.
  sg-scan:
    name: sg-scan
    if: github.event_name != 'push'
    concurrency:
      group: statecraft-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}-sg-scan
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: ast-grep scan (sgconfig.yml)
        run: |
          if [ ! -f sgconfig.yml ]; then
            echo "- ast-grep 0.51.0: not-configured (sgconfig.yml is absent)" >> "$GITHUB_STEP_SUMMARY"
            echo "ast-grep: not-configured (sgconfig.yml is absent)"
            exit 0
          fi
          dir="${RUNNER_TEMP}/statecraft-tools"
          mkdir -p "$dir"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$dir/ast-grep.zip" https://github.com/ast-grep/ast-grep/releases/download/0.51.0/app-x86_64-unknown-linux-gnu.zip
          echo "a7eead5552d3a8daad70f5d50d935da44bd0c138e946b5b0a96b1d38169fa639  $dir/ast-grep.zip" | sha256sum -c -
          unzip -q -o "$dir/ast-grep.zip" ast-grep -d "$dir"
          "$dir/ast-grep" scan
          echo "- ast-grep 0.51.0: scanned with sgconfig.yml" >> "$GITHUB_STEP_SUMMARY"

  # Revision 22 (spec 044 section 3.6): committed secrets, by gitleaks from
  # its digest-verified release archive. A pull request's commits since the
  # merge base, a queue entry's, or a push's range; a finding names the rule
  # and location and never the matched value. An allowlist is the project's
  # committed gitleaks configuration; the profile adds none.
  secret-scan:
    name: secret-scan
    if: github.event_name != 'push'
    concurrency:
      group: statecraft-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}-secret-scan
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1
        run: |
          dir="${RUNNER_TEMP}/statecraft-tools"
          mkdir -p "$dir"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$dir/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
          echo "$dir" >> "$GITHUB_PATH"
      - name: gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          case "$BASE_SHA" in 0000000000000000000000000000000000000000) BASE_SHA="" ;; esac
          if [ -z "$BASE_SHA" ]; then
            # A push that created the branch has no before: every commit it carries.
            range="$HEAD_SHA"
          elif [ "$EVENT_NAME" = pull_request ]; then
            if ! merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"; then
              echo "no merge base between ${BASE_SHA} and ${HEAD_SHA}; the scan cannot choose its commits" >&2
              exit 2
            fi
            range="${merge_base}..${HEAD_SHA}"
          else
            range="${BASE_SHA}..${HEAD_SHA}"
          fi
          echo "scanning ${range}"
          gitleaks git --no-banner --no-color --redact --verbose --log-opts="${range}" .

  ai-review:
    name: ai-review
    if: github.event_name == 'pull_request'
    concurrency:
      group: statecraft-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}-ai-review
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # zizmor recommends `$/` for a call in the same repository; `./` is the
    # form every runner and the pin check read (revision 22).
    uses: ./.github/workflows/statecraft-ai-review.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      pull-requests: write
      checks: write
    # Revision 8: both credentials, by name; the review prefers the API key.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # A release candidate whose review was skipped needs an owner exception,
  # recorded outside the candidate: an approval on this protected Environment,
  # whose required reviewers the operator sets and the author cannot grant.
  review-exception:
    name: review-exception
    needs: [governance, ai-review]
    # The owner exception (S-1): a release candidate whose review was skipped,
    # (revision 2, R2-1) any pull request whose review returned findings, and
    # (revision 5, rule 2) any pull request that changes the authority set,
    # and (revision 12) any pull request that ratifies a spec. Revision 26
    # (spec 068): findings that are all low and answered need none.
    if: always() && github.event_name == 'pull_request' && (needs.governance.outputs.authority_change == 'true' || needs.governance.outputs.ratification == 'true' || (needs.ai-review.outputs.release_candidate == 'true' && startsWith(needs.ai-review.outputs.result, 'skipped:')) || (needs.ai-review.outputs.result == 'findings' && needs.ai-review.outputs.answered != 'true'))
    runs-on: ubuntu-latest
    environment: statecraft-review-exception
    steps:
      - name: Record the owner exception
        env:
          RESULT: ${{ needs.ai-review.outputs.result }}
          AUTHORITY_CHANGE: ${{ needs.governance.outputs.authority_change }}
          RATIFICATION: ${{ needs.governance.outputs.ratification }}
        run: echo "owner exception approved for a pull request whose review was ${RESULT} (authority change ${AUTHORITY_CHANGE}, ratification ${RATIFICATION})"

  determinism:
    name: determinism
    needs: [preflight]
    if: ${{ !cancelled() && (needs.preflight.result == 'success' || github.event_name == 'push') }}
    concurrency:
      group: statecraft-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}-determinism
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/determinism.yml # zizmor: ignore[self-repository]
    with:
      post_merge: ${{ github.event_name == 'push' }}

  spec-spine-required:
    name: spec-spine-required
    needs: [preflight]
    if: ${{ !cancelled() && (needs.preflight.result == 'success' || github.event_name == 'push') }}
    concurrency:
      group: statecraft-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}-spec-spine-required
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/spec-spine-required.yml # zizmor: ignore[self-repository]
    with:
      post_merge: ${{ github.event_name == 'push' }}

  affected-acceptance:
    name: affected-acceptance
    needs: [preflight]
    if: ${{ !cancelled() && (needs.preflight.result == 'success' || github.event_name == 'push') }}
    concurrency:
      group: statecraft-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}-affected-acceptance
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/affected-acceptance.yml # zizmor: ignore[self-repository]
    with:
      post_merge: ${{ github.event_name == 'push' }}

  # Revision 7: every job the project declares in ci.extra_required_jobs is a
  # call of its own reusable workflow, needed here and required by the policy
  # exactly as the profile's jobs are: failed, cancelled and skipped all block.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [governance, preflight, code, supply-chain, workflow-lint, sg-scan, secret-scan, ai-review, review-exception, determinism, spec-spine-required, affected-acceptance]
    runs-on: ubuntu-latest
    # Read-only: on merge_group the gate reads the recorded review (the
    # entry's pull request, its runs, their jobs and the evidence artifact).
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gate script itself is read from the base, as its policy is; the
      # candidate's copy runs only when the base has none (the adoption).
      - name: Aggregate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          HEAD_REF: ${{ github.head_ref }}
          GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          script="${RUNNER_TEMP}/statecraft-ci-gate.sh"
          # Revision 12: only a readable base without the script is the
          # adoption; an unreadable base stops before the candidate is read.
          case "$BASE_SHA" in 0000000000000000000000000000000000000000) BASE_SHA="" ;; esac
          if [ -n "$BASE_SHA" ] && ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "cannot read the base commit ${BASE_SHA}; ci-gate.sh is never taken from the candidate in its place" >&2
            exit 2
          fi
          if [ -n "$BASE_SHA" ] && git show "${BASE_SHA}:scripts/statecraft/ci-gate.sh" > "$script" 2>/dev/null; then
            echo "ci-gate.sh: read at the base ${BASE_SHA}"
          else
            cp scripts/statecraft/ci-gate.sh "$script"
            echo "ci-gate.sh: the base carries none; the candidate's copy runs (adoption)"
          fi
          bash "$script"
