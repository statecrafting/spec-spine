            echo "deny.toml is absent: revision 22 requires a committed dependency policy, and this check never passes without one" >&2
            exit 2
          fi
          cargo deny --locked check all
          echo "- cargo-deny 0.20.2: checked against deny.toml" >> "$GITHUB_STEP_SUMMARY"
      - name: cargo audit (.cargo/audit.toml)
        run: |
          if [ ! -f .cargo/audit.toml ]; then
            echo "- cargo-audit 0.22.2: not-configured (.cargo/audit.toml is absent)" >> "$GITHUB_STEP_SUMMARY"
            echo "cargo audit: not-configured (.cargo/audit.toml is absent)"
            exit 0
          fi
          cargo audit --deny unmaintained --deny unsound
          echo "- cargo-audit 0.22.2: checked against .cargo/audit.toml" >> "$GITHUB_STEP_SUMMARY"
      - name: cargo vet (supply-chain/config.toml)
        run: |
          if [ ! -f supply-chain/config.toml ]; then
            echo "- cargo-vet 0.10.3: not-configured (supply-chain/config.toml is absent)" >> "$GITHUB_STEP_SUMMARY"
            echo "cargo vet: not-configured (supply-chain/config.toml is absent)"
            exit 0
          fi
          cargo vet --locked
          echo "- cargo-vet 0.10.3: checked against supply-chain/" >> "$GITHUB_STEP_SUMMARY"

