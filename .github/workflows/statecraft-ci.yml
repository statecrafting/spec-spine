          dir="${RUNNER_TEMP}/statecraft-tools"
          mkdir -p "$dir"
          fetch() {
            curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$dir/$1" "$2"
            echo "$3  $dir/$1" | sha256sum -c -
