      # and recompiles only this workspace's crates. Revision 18: restored on
      # every event, saved only by a push to the default branch, because a
      # pull request's cache is readable by no other pull request and its
      # saves evicted the default branch's entry.
      - name: Restore cargo registry, git and target
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-
          lookup-only: ${{ github.event_name == 'push' }}
