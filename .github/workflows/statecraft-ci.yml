        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # Revision 22 (spec 044 section 3.2): where the code's dependencies come
  # from. Each tool is a release archive at an exact version, refused unless
  # its SHA-256 equals the digest recorded here; upgrading one is a profile
  # revision. deny.toml is mandatory: without it the deny step fails, it
  # never records not-configured. The audit and vet steps run when their
  # policy file is committed and otherwise record not-configured and pass.
