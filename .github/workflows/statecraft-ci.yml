# Rendered by Statecraft from profile github-actions-rust revision 28
# (identity ddb55e6ee7c1478b1c88463a3f2fa7a53b3f20aad492a7dfcae29cbbd4d21178). A managed file and a member of this
# repository's authority set: an edit here changes the gate that judges every
# pull request, and `statecraft doctor` names it. The policy the aggregate gate
# enforces is .statecraft/setup/github-actions-rust.json, read at the base.
name: statecraft-ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  # Revision 3: a required merge queue judges each queued entry here. The
  # review is not re-run for it; ci-gate reads the verdict recorded for the
  # entry's pull request.
  merge_group:

# Revision 18 (specs 058 and 059): a newer push to a pull request cancels the
# work of that pull request's older run, job by job. Every job but
# review-exception and ci-gate has a concurrency group of its pull request and
# job; the two left out can wait on the owner exception, and a run waiting on
# an Environment is never cancelled by a group, so a group it held would leave
# the newer run pending behind it. A push to the default branch and a
# merge-queue entry get groups of their own run, so neither is ever cancelled.
#
# Revision 24 (spec 067): where the policy records a required merge queue
# (remote.merge_queue), a push to the default branch is a post-merge push:
# the queue already judged that exact commit. Every job that judges is skipped
# on it; code runs only its cache steps, building only to fill a missed key;
# a declared extra job is called with the input post_merge true, so it can
# skip its own expensive steps; and ci-gate admits the skips by the
# post-merge rule only when the commit passed ci-gate in the merge queue.
#
# Revision 25 (spec 069): where the setup parameter ci.code.free_disk is
# true, the code job removes the runner's unused preinstalled toolchains
# before it builds, and reports the free space before and after.
#
# Revision 26 (spec 068): a finding carries a severity, a category and an id.
# A pull request whose findings are all low and other, each answered by a
# `Review note (<sha8>): <id>` line of its body for that head, needs no owner
# exception. An edited pull request runs again and keeps the review recorded
# for its head, so the ids its notes name are the ones read.

permissions:
  contents: read

jobs:
  governance:
    name: governance
    if: github.event_name != 'push'
    concurrency:
      group: statecraft-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}-governance
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    # `pull-requests: read` is for the merge-queue steps, which read the
    # queued pull request's changed files, title and body. Nothing here
    # writes; the commit walk reads each commit's verification.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      authority_change: ${{ steps.authority.outputs.authority_change }}
      ratification: ${{ steps.authority.outputs.ratification }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Revision 5, rule 1: a candidate never judges itself with its own gate.
      # gate.sh and install-spec-spine.sh are read at the base, as ci-gate.sh
      # is; the candidate's copies run only when the base carries none (the
      # adoption), and the step says which ran. A base commit that cannot be
      # read stops the job rather than falling back.
      - name: Read the gate at the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          dir="${RUNNER_TEMP}/statecraft"
          mkdir -p "$dir"
          case "$BASE_SHA" in 0000000000000000000000000000000000000000) BASE_SHA="" ;; esac
          if [ -n "$BASE_SHA" ] && ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "cannot read the base commit ${BASE_SHA}; the gate is never taken from the candidate in its place" >&2
            exit 2
          fi
          for f in gate.sh install-spec-spine.sh; do
            if [ -n "$BASE_SHA" ] && git show "${BASE_SHA}:scripts/statecraft/${f}" > "${dir}/${f}" 2>/dev/null; then
              echo "${f}: read at the base ${BASE_SHA}"
            else
              cp "scripts/statecraft/${f}" "${dir}/${f}"
              echo "${f}: the base carries none; the candidate's copy runs (adoption)"
            fi
          done
          echo "STATECRAFT_GATE=${dir}/gate.sh" >> "$GITHUB_ENV"
          echo "STATECRAFT_INSTALL=${dir}/install-spec-spine.sh" >> "$GITHUB_ENV"
      # Revision 5, rule 2: whether this pull request changes the authority
      # set, read from the base's policy. It only decides whether the owner
      # exception job runs; ci-gate recomputes it at the base and never reads
      # this output, so a candidate that skips the exception fails closed.
      - name: Authority change
        id: authority
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          policy=.statecraft/setup/github-actions-rust.json
          work="${RUNNER_TEMP}/statecraft-authority"
          mkdir -p "$work"
          change=false
          if ! git show "${BASE_SHA}:${policy}" > "${work}/policy.json" 2>/dev/null; then
            echo "the base carries no policy (the adoption): ci-gate reports the authority change"
          elif ! jq -e '.authority_rule' "${work}/policy.json" > /dev/null; then
            echo "the base's policy predates revision 5: ci-gate reports an authority change and does not block it"
          else
            { jq -r '.files[].path, (.parameters.authored_content // empty), (.parameters.code.script // empty)' "${work}/policy.json"; echo "$policy"; } | sort -u > "${work}/set"
            git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | sort -u > "${work}/changed"
            { comm -12 "${work}/set" "${work}/changed"; grep '^scripts/statecraft/' "${work}/changed" || true; grep '^\.github/workflows/' "${work}/changed" || true; } | sort -u > "${work}/touched"
            if [ -s "${work}/touched" ]; then
              change=true
              echo "authority change: the owner exception is required for this run:"
              cat "${work}/touched"
            else
              echo "no authority change"
            fi
          fi
          echo "authority_change=${change}" >> "$GITHUB_OUTPUT"
          # Revision 12 (spec 024): a changed spec.md that becomes approved is
          # a ratification, which needs the owner exception too; ci-gate
          # recomputes it from the two trees.
          status_at() {
            if git cat-file -e "$1:$2" 2>/dev/null; then
              git show "$1:$2" > "${work}/spec.md"
              awk 'NR == 1 && $0 != "---" { done = 1 } NR > 1 && $0 == "---" { done = 1 } !done && NR > 1 && /^status:/ { sub(/^status:[[:space:]]*/, ""); gsub(/["\047]/, ""); sub(/[[:space:]]+$/, ""); print; done = 1 }' "${work}/spec.md"
            fi
          }
          ratification=false
          git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > "${work}/changed-all"
          while IFS= read -r path; do
            case "$path" in spec.md | */spec.md) ;; *) continue ;; esac
            if [ "$(status_at "$HEAD_SHA" "$path")" = approved ] && [ "$(status_at "$BASE_SHA" "$path")" != approved ]; then
              ratification=true
              echo "ratification: ${path} becomes approved; the owner exception is required for this run"
            fi
          done < "${work}/changed-all"
          echo "ratification=${ratification}" >> "$GITHUB_OUTPUT"
      # Revision 4, rule 6: a cache, never a check. The key is the pin, so a
      # pin bump is a miss; the install step still verifies the version.
      - name: Read the spec-spine pin
        id: pin
        run: sh "${STATECRAFT_GATE:?}" pin >> "$GITHUB_OUTPUT"
      - name: Cache spec-spine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bin/spec-spine
          key: spec-spine-${{ steps.pin.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install the pinned spec-spine
        run: sh "${STATECRAFT_INSTALL:?}"
      # Revision 4, rule 5: a stacked pull request is never judged against
      # the default branch, so it fails here (governance.require_default_base).
      - name: The base is the default branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: sh "${STATECRAFT_GATE:?}" base
      # The declared authored-content script is read at the base too, by the
      # base's gate.sh (revision 5, rule 1).
      - name: Governance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: sh "${STATECRAFT_GATE:?}" governance
      # Revision 4, rule 3: the title and body become the landed commit's
      # message (governance.authored_content_text).
      - name: Authored-content rules (title and body)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: sh "${STATECRAFT_GATE:?}" text
      # Revision 4, rules 3 and 4: every commit in the change, a step of this
      # job so it cannot be skipped into a green gate.
      - name: Every commit in the change
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: sh "${STATECRAFT_GATE:?}" commits
      # A documented step-level inapplicability, not a job skip: coupling
      # compares a pull request's two frozen endpoints, and a push has none.
      - name: Coupling gate
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: sh "${STATECRAFT_GATE:?}" couple
      # The queued candidate: the group's own endpoints, and the waiver of the
      # entry's pull request only when the group changes nothing else.
      - name: Coupling gate (merge queue)
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: sh "${STATECRAFT_GATE:?}" couple-group
      # Revision 22 (spec 044 section 3.3): a pull request that changes a
      # dependency or policy file and anything else must be split. The guard
      # is read at the base, as the gate is; the candidate's copy runs only
      # when the base carries none (the adoption).
      - name: Policy isolation
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          guard="${RUNNER_TEMP}/statecraft/guard-policy-files.sh"
          if git show "${BASE_SHA}:scripts/statecraft/guard-policy-files.sh" > "$guard" 2>/dev/null; then
            echo "guard-policy-files.sh: read at the base ${BASE_SHA}"
          else
            cp scripts/statecraft/guard-policy-files.sh "$guard"
            echo "guard-policy-files.sh: the base carries none; the candidate's copy runs (adoption)"
          fi
          sh "$guard" "$BASE_SHA" "$HEAD_SHA"

  # Revision 18: the cheap checks that would fail an expensive job anyway,
  # run first: a pull request's base, the committed artifacts' freshness and,
  # for a Rust code selection, formatting. The code job and every declared
  # extra job need it, so a stacked pull request skips them unless it carries
  # the label statecraft:stacked-ci, an explicit request for full validation.
  # Every check here also runs in governance or code; preflight only orders
  # them, and a base gate.sh without the verb (the adoption) judges nothing.
