name: CI

# Build + test + lint, then self-governance: run spec-spine's OWN governance gates
# against its OWN corpus. A spec-spine that is not itself spec-governed is hypocritical.
#
# Cross-triple tree-sitter symbol-span determinism is a Phase-5 release-matrix
# concern (the resolver is pinned exact; see docs/design/00-architecture.md §10.1),
# not gated here.

on:
  push:
    branches: [main]
  pull_request:
  # Spec 094: GitHub merge queue. Each queued PR is tested against the
  # speculative merged tree, so a green PR cannot be silently invalidated by
  # the one ahead of it (e.g. a duplicate spec id introduced on two branches).
  # The coupling gate stays pull_request-only (it reads the PR-body waiver, which
  # merge_group does not carry); every other check runs here. INERT until a repo
  # admin enables the merge queue in branch protection.
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build · test · clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the exact channel (+ rustfmt, clippy).
      - name: Show toolchain
        run: rustc --version && cargo --version
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Format
        run: cargo fmt --all --check
      # Spec 025: prove `spec-spine-core` compiles, tests, and lints with symbol
      # resolution OFF, so a host workspace pinning a different tree-sitter can embed
      # the committed-shard readers without a `links = "tree-sitter"` clash. A
      # regression that re-couples the readers to tree-sitter fails here.
      - name: Build (no default features)
        run: cargo build -p spec-spine-core --no-default-features --locked
      - name: Assert tree-sitter absent without the feature
        run: |
          if cargo tree -p spec-spine-core --no-default-features -i tree-sitter --locked 2>/dev/null | grep -q .; then
            echo "::error::tree-sitter must NOT be in the --no-default-features dependency tree"
            exit 1
          fi
      - name: Test (no default features)
        run: cargo test -p spec-spine-core --no-default-features --locked
      - name: Clippy (no default features)
        run: cargo clippy -p spec-spine-core --no-default-features --all-targets --locked -- -D warnings

  # Spec 134: the workspace test suite on Windows, reported as a check of its
  # own so a Windows test result is never read as a build result. The
  # determinism job builds on Windows; this one runs the tests. A test that
  # cannot run there is gated or quarantined in the test source with a tracked
  # finding (docs/windows-findings.md), never skipped here.
  test_windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain
        run: rustc --version && cargo --version
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

  self_governance:
    name: self-governance (compile · index · lint · couple)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the coupling gate can diff against the merge base.
          fetch-depth: 0
      - name: Build CLI
        run: cargo build --bin spec-spine --locked
      # ONE gate definition (spec 094, moved to the root `Makefile` by spec
      # 092 3.6): this job calls the target, it does not restate the chain.
      # `SPEC_SPINE` points at the binary this job built, which is spec 093's
      # resolution order: a repository that builds its own binary must be
      # governed by the one it builds.
      #
      # Nothing here writes to the derived tree. `gate` runs `check` rather
      # than `compile`/`index` precisely so a gate never repairs the tree it is
      # judging: it exits 1 on a frontmatter violation or an unresolved claim
      # and 2 when a spec.md was edited without recomputing the shards (which
      # is what PR #61 did to specs 016 and 021, undetected).
      #
      # Two legs, one definition, selected by explicit controls rather than by
      # inference (spec 094 3.3):
      #
      #   push / merge_group   COUPLE=0. The change has already merged, so
      #                        there is nothing left to refuse, and there is no
      #                        PR body, so a `Spec-Drift-Waiver:` line is
      #                        unrecoverable: it lives in the PR description,
      #                        not in the squash commit message. A legitimately
      #                        waived PR would otherwise resurface as a false
      #                        drift failure on the post-merge push.
      #   pull_request         COUPLE=1, with both diff endpoints passed as the
      #                        event's FROZEN SHAs and the body written to a
      #                        file for the waiver read.
      #
      # `base.sha...head.sha` is a three-dot diff whose merge base is this PR's
      # fork point, so it evaluates exactly the PR's own changes and is stable
      # across re-runs. The checked-out `refs/pull/N/merge` HEAD is NOT that:
      # it re-resolves against the current base every time the job runs, so a
      # gate diffing to it folds in unrelated changes merged after this PR
      # opened and reports them as drift (or silently widens a waiver's scope).
      - name: Governed loop (make gate, push leg)
        if: github.event_name != 'pull_request'
        run: make gate SPEC_SPINE=./target/debug/spec-spine OWNERSHIP=1 COUPLE=0
      - name: Governed loop (make gate, pull-request leg)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY_TEXT: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "coupling base: $BASE_SHA -> head: $HEAD_SHA"
          printf '%s' "${PR_BODY_TEXT:-}" > "$RUNNER_TEMP/pr-body.txt"
          make gate SPEC_SPINE=./target/debug/spec-spine OWNERSHIP=1 COUPLE=1 \
            BASE="$BASE_SHA" HEAD="$HEAD_SHA" PR_BODY="$RUNNER_TEMP/pr-body.txt"


  # Cross-triple determinism golden, run as a reusable workflow so a single
  # `ci-gate` check below covers it too (spec 094).
  determinism:
    name: determinism
    uses: ./.github/workflows/determinism.yml

  # AI PR review folded into the gate (OAP spec 177 + 085 precedent). PR-only:
  # it needs PR context (number, base/head diff), so it is skipped on
  # push/merge_group/workflow_dispatch, which ci-gate treats as success.
  # Job-level pull-requests: write overrides the workflow read default (the
  # review posts a comment). Only CLAUDE_CODE_OAUTH_TOKEN is forwarded (an
  # explicit map, not `secrets: inherit`), so the crates.io/npm/PyPI publish
  # tokens are never exposed to this PR-triggered job.
  # A Claude API outage passes with a visible notice (spec 177 resilience); an
  # auth failure still hard-fails; a fork PR (no secret access) skips visibly.
  ai-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: ./.github/workflows/ai-pr-review.yml

  # Spec 094: the single required status check for branch protection and the
  # merge queue. It aggregates every CI job, so branch protection requires just
  # this one name instead of an enumerated, drift-prone list. A skipped job
  # (e.g. a future event-gated one) counts as a pass; a failed or cancelled job
  # fails the gate.
  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [test, test_windows, self_governance, determinism, ai-review]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to have passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A required CI job failed or was cancelled:"
          echo "  test=${{ needs.test.result }}  test_windows=${{ needs.test_windows.result }}  self_governance=${{ needs.self_governance.result }}  determinism=${{ needs.determinism.result }}  ai-review=${{ needs.ai-review.result }}"
          exit 1
      - name: All required CI jobs passed
        run: |
          echo "ci-gate passed: test, test_windows, self_governance, determinism, and ai-review are all green or skipped"
