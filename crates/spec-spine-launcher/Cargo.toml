[package]
name = "spec-spine-launcher"
description = "The spec-spine launcher: reads a repository's engine pin, resolves and verifies that exact engine release, and executes it. Implements no governance verb."
# The launcher is released with its own version (spec 188 section 3.1), not the
# engine's workspace version.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Which channel ships the launcher is a later spec (188 section 4).
publish = false

# The launcher is invoked as `spec-spine` once a channel installs it under that
# name. The target here is named differently because `spec-spine-cli` already
# owns the `spec-spine` binary target in this workspace (spec 188 D-10).
[[bin]]
name = "spec-spine-launcher"
path = "src/main.rs"

[package.metadata.spec-spine]
spec = "188-a-repository-pin-selects-the-engine"

# Deliberately no engine crate: the launcher depends on nothing from
# spec-spine-types or spec-spine-core (spec 188 section 3.1).
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
