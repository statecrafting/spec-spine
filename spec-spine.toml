# spec-spine governing its own repository (dogfood).
#
# This repo is a single Cargo workspace with specs/ at the root and no npm
# packages, so most of this matches the built-in defaults; it is written out
# explicitly to exercise the config parser and document the dogfood setup.
# Every key here is optional; an absent file would behave identically.

# Spec 074 3.8: this repository pins the version that governs it. Spec 062 built
# the key for exactly the failure a dogfooding repository is most exposed to, an
# in-tree `target/release/spec-spine` that predates the checkout, and this
# repository was not using it.
#
# A FLOOR, not an exact pin. The failure guarded is one-directional (a binary
# older than the corpus it judges), and `scripts/bump_version.py` does not touch
# this key, so `= "0.17.0"` would turn the next release bump into a self-
# inflicted exit 3 on every command. `>=` catches what 3.8 names and nothing
# else.
#
# `Config` derives `deny_unknown_fields`, so a binary predating spec 062 fails
# to deserialize this key and exits 3 with a config error, never 2. The signal
# is unambiguous in both directions.
[meta]
required_version = ">=0.17.0"

[manifest]
# Our own crates carry `[package.metadata.spec-spine].spec = "NNN-slug"`.
metadata_namespace = "spec-spine"

[domains]
allowed = []        # disabled: specs in this repo do not declare a `domain`

[kind]
allowed = []        # disabled: `kind` is free-text here (symmetric with [domains])

[layout]
specs_dir     = "specs"
derived_dir   = ".derived"
standards_dir = "standards/spec"
schemas_dir   = "standards/schemas"
cargo_workspace = "Cargo.toml"
# No npm in this repo; the default still probes these at the root and finds none.
npm_workspaces = ["package.json", "pnpm-workspace.yaml"]
standalone_rust_workspaces = []
# The npm binary-distribution shim (spec 007) is a tracked npm package outside any
# npm workspace (this repo has none), so it is declared as a standalone package.
standalone_npm_packages    = ["npm"]

[index]
# Files folded into the global-inputs scalar, so a change to one stales every
# shard. Spec 057 found the first two entries here matched ZERO files: in the
# `glob` crate `dir/**` matches directories only, and files need `dir/**/*`.
# The constitution, the contract, the templates and every workflow had
# therefore never contributed to any content hash, and spec 023 was signing an
# attestation over a ledger that had not read them.
#
# Every pattern below is deliberately narrow. This list hashes whatever is on
# disk, tracked or not, so a bare `.claude/**/*` would fold in `.DS_Store`,
# `agent-memory/` and `settings.local.json` and make the shard hashes
# machine-dependent, which the four-triple determinism gate would catch as a
# platform difference. Narrow patterns also keep the blast radius honest: an
# entry here restales all 69 shards when it changes, so it earns its place by
# being a governance file some spec claims.
extra_hashed_inputs = [
  "standards/**/*.md",
  ".github/workflows/*.yml",
  # Governance and harness files specs claim (spec 057).
  "AGENTS.md",
  "CLAUDE.md",
  ".claude/rules/*.md",
  ".claude/settings.json",
  ".githooks/*.sh",
  "scripts/*.sh",
  "install.sh",
  "docs/adoption-guide.md",
  "docs/releasing.md",
  "docs/schema-versioning.md",
  "docs/specify-first.md",
  "kit/AGENTS.md",
  "kit/README.md",
  "kit/settings.json",
  "kit/.claude/rules/*.md",
  # Spec 064: the kit's build half. Claimed, so they are hashed rather than
  # allowlisted; a change to the gate adopters copy should stale the ledger.
  "kit/Makefile",
  "kit/govern.yml",
  "kit/.githooks/*.sh",
  "kit/.gitattributes-stanza",
  # Spec 065: the kit's own skills, agents and settings are the source the
  # embedded module is generated from, so a change to one must stale the ledger.
  "kit/.claude/agents/*.md",
  "kit/.claude/skills/*/*.md",
  "kit/.mcp.json",
  "kit/scripts/*.sh",
  "scripts/*.py",
  "py/scripts/*.py",
  # The embedded JSON Schemas the conformance test validates against. Hashed
  # rather than allowlisted: a schema edit is exactly the kind of change the
  # ledger should notice, and it is rare enough that restaling every shard is
  # the right price.
  "crates/spec-spine-types/schemas/*.json",
]
resolver_exclusions = ["target", "node_modules", ".derived", "dist", "build", ".next"]

[branding]
compiler_id = "spec-spine"
indexer_id  = "spec-spine"

[coupling]
# Additions to the built-in generic bypass floor (see couple.rs::DEFAULT_BYPASS_PREFIXES).
# This list is ADDITIVE and cannot remove a floor entry. The floor already covers
# the root README.md, docs/, .github/, lockfiles, .derived/, etc.; we extend it to
# per-crate READMEs (e.g. crates/*/README.md): prose documentation lives inside
# the crate dir, which manifest-metadata maps to the crate's spec, so without this
# a README tweak would read as code drift. `**/README.md` = tail-suffix match.
bypass_prefixes = ["**/README.md"]
waiver_keyword = "Spec-Drift-Waiver:"
# Spec 032: refuse a changed source file that no spec specifically claims
# (C-002). ON here: the debt 032 §3.8 named is retired. Those five files are
# claimed by `// Spec: specs/<id>/spec.md` headers in the files themselves
# rather than by new frontmatter units, because a header is a file naming the
# spec that already governs it, which is exactly what was true and never
# written down. That also keeps the claim out of the tier-1 bootstrap spec:
# nothing in specs/000 changed. `index coverage` now reports 65/65, and CI
# defends it with `index coverage --fail-on-untraced`. This knob is the PR-time
# half: a changed source file no spec specifically claims is C-002.
require_ownership = true

# Spec 005 §3.5, extended to cargo and workflow manifests by spec 030: clear a
# change whose every non-bypassed path is a dependency-only manifest edit, with
# no other change in the diff. The waiver is mechanical, not a judgement: the
# CLI re-reads each manifest at base and at head and refuses to waive unless the
# only difference is dependency versions, and any git failure refuses it too.
# On for the reason 030 was written. A Dependabot PR cannot add a
# `Spec-Drift-Waiver:` line to its own body, and its restricted token has no
# access to the secret store, so without this a routine `Cargo.toml` or
# `.github/workflows/*.yml` version bump is unmergeable: it trips C-001 against
# an owning spec that has nothing to say about a patch-level dependency bump.
# Note this does NOT weaken the gate for source edits; a diff containing any
# non-manifest change falls straight through to the ordinary drift check.
auto_waive_dependency_only = true

[provenance.uri_schemes]
knowledge        = "knowledge://"
code-fingerprint = "fingerprint://"

[frontmatter]
extra_known_keys = []

[lint]
# Spec 057: claimed paths this corpus deliberately leaves out of every content
# hash. A `file` unit carries no span, and only span-backing files enter a
# shard hash, so every source file claimed as a bare file unit is invisible to
# the ledger. That is 74 files here, and folding them in is a different change
# (it would alter what staleness means) that spec 057 4 puts out of scope.
#
# They are not undefended: the coupling gate refuses a changed source file
# whose owning spec did not change, which is the check that actually protects
# them. What the gap costs is narrower and worth writing down: `index check`
# will not call the index stale for an edit to one of these, and spec 023's
# attestation covers a ledger that never hashed their bytes.
#
# `index check` still reports the total on every run and says how many of it
# this list covers, so the exception is explicit rather than invisible.
unwitnessed_allowed = ["crates/**/*.rs"]
